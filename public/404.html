<!doctype html>
<!--
  Custom "page not found" page. Vercel serves this file automatically for any
  address that doesn't exist. It's plain HTML + CSS (no React), so it loads instantly.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Sk Nadeem Ahammad</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Use the visitor's saved light/dark choice from the main site -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.remove('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f8fafc');
        }
      } catch (e) {}
    </script>

    <style>
      /* Same self-hosted font as the main site */
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url('/fonts/plus-jakarta-sans-latin-variable.woff2') format('woff2');
      }

      :root {
        --page: #f8fafc;
        --text: #0f172a;
        --muted: #475569;
        --card: rgba(255, 255, 255, 0.75);
        --border: rgba(15, 23, 42, 0.1);
        --hex: rgba(15, 23, 42, 0.07);
        --shine: rgba(255, 255, 255, 0.9);
      }
      .dark {
        --page: #000000;
        --text: #ffffff;
        --muted: #9ca3af;
        --card: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.1);
        --hex: rgba(255, 255, 255, 0.05);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--page);
        color: var(--text);
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        position: relative;
      }

      /* Faint hexagon grid, drawn with an SVG pattern so it can use the theme colour */
      .hex {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        color: var(--hex);
        pointer-events: none;
      }

      /* Soft glows */
      .glow {
        position: fixed;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.25;
        pointer-events: none;
        animation: float 9s ease-in-out infinite;
      }
      .glow.blue { background: #3b82f6; top: 10%; left: 15%; }
      .glow.purple { background: #a855f7; bottom: 5%; right: 12%; animation-delay: -4s; }
      @keyframes float {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(30px, -25px); }
      }

      .card {
        position: relative;
        width: 100%;
        max-width: 560px;
        padding: 48px 32px;
        text-align: center;
        border-radius: 28px;
        background: var(--card);
        border: 1px solid var(--border);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 25px 60px -20px rgba(59, 130, 246, 0.25);
        animation: rise 0.7s ease-out both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: none; }
      }

      /* Big "404" with a light sweeping across the gradient (same effect as the name on the home page) */
      .code {
        font-size: clamp(96px, 22vw, 160px);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -4px;
        background-image:
          linear-gradient(110deg, transparent 35%, var(--shine) 50%, transparent 65%),
          linear-gradient(to right, #60a5fa, #a855f7, #ec4899);
        background-size: 250% 100%, 100% 100%;
        background-repeat: no-repeat;
        background-position: 150% 0, 0 0;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 4s ease-in-out infinite;
      }
      @keyframes shine {
        0% { background-position: 150% 0, 0 0; }
        60%, 100% { background-position: -50% 0, 0 0; }
      }

      h1 {
        margin-top: 12px;
        font-size: clamp(24px, 5vw, 32px);
        font-weight: 800;
      }

      p {
        margin: 12px auto 0;
        max-width: 380px;
        color: var(--muted);
        line-height: 1.6;
      }

      .path {
        display: inline-block;
        margin-top: 16px;
        padding: 6px 12px;
        border-radius: 999px;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 13px;
        color: var(--muted);
        background: var(--card);
        border: 1px solid var(--border);
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .actions {
        margin-top: 32px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      }
      .btn:hover { transform: translateY(-2px); }
      .btn:active { transform: scale(0.96); }
      .btn.primary {
        color: #fff;
        background: linear-gradient(to right, #2563eb, #9333ea);
        box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.6);
      }
      .btn.secondary {
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
      }
      .btn.secondary:hover { border-color: rgba(59, 130, 246, 0.5); }

      .contact {
        margin-top: 24px;
        font-size: 14px;
        color: var(--muted);
      }
      .contact a { color: #3b82f6; text-decoration: none; font-weight: 600; }
      .contact a:hover { text-decoration: underline; }

      @media (prefers-reduced-motion: reduce) {
        .glow, .card, .code { animation: none; }
        .code { background-position: -50% 0, 0 0; }
      }
    </style>
  </head>
  <body>
    <svg class="hex" aria-hidden="true">
      <defs>
        <pattern id="hex" width="60" height="103.92" patternUnits="userSpaceOnUse">
          <path d="M30 103.92L0 86.6V51.96L30 34.64L60 51.96V86.6Z M0 34.64L30 17.32L60 34.64" fill="none" stroke="currentColor" stroke-width="1" />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#hex)" />
    </svg>
    <div class="glow blue"></div>
    <div class="glow purple"></div>

    <main class="card">
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
      <div class="path" id="path"></div>

      <div class="actions">
        <a class="btn primary" href="/">
          <!-- house icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Back to Home
        </a>
        <a class="btn secondary" href="/#projects">
          <!-- code icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          View Projects
        </a>
      </div>

      <p class="contact">Think something's broken? <a href="/#contact">Let me know</a></p>
    </main>

    <script>
      // Show the address the visitor tried to open
      document.getElementById('path').textContent = window.location.pathname;
    </script>
  </body>
</html>
