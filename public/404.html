<!doctype html>
<!--
  Custom "page not found" page. Vercel serves this file automatically for any
  address that doesn't exist. It's plain HTML + CSS (no React), so it loads instantly.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Sk Nadeem Ahammad</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Use the visitor's saved light/dark choice from the main site -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.remove('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f8fafc');
        }
      } catch (e) {}
    </script>

    <style>
      /* Same self-hosted font as the main site */
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url('/fonts/plus-jakarta-sans-latin-variable.woff2') format('woff2');
      }

      :root {
        --page: #f8fafc;
        --text: #0f172a;
        --muted: #475569;
        --card: rgba(255, 255, 255, 0.75);
        --border: rgba(15, 23, 42, 0.1);
        --hex: rgba(15, 23, 42, 0.07);
        --shine: rgba(255, 255, 255, 0.9);
      }
      .dark {
        --page: #000000;
        --text: #ffffff;
        --muted: #9ca3af;
        --card: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.1);
        --hex: rgba(255, 255, 255, 0.05);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--page);
        color: var(--text);
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden; /* the glows may poke out sideways; vertical scroll stays on for short screens */
        position: relative;
      }

      /* Faint hexagon grid, drawn with an SVG pattern so it can use the theme colour */
      .hex {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        color: var(--hex);
        pointer-events: none;
      }

      /* Soft glows */
      .glow {
        position: fixed;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.25;
        pointer-events: none;
        animation: float 9s ease-in-out infinite;
      }
      .glow.blue { background: #3b82f6; top: 10%; left: 15%; }
      .glow.purple { background: #a855f7; bottom: 5%; right: 12%; animation-delay: -4s; }
      @keyframes float {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(30px, -25px); }
      }

      .card {
        position: relative;
        width: 100%;
        max-width: 620px;
        padding: 44px 28px;
        text-align: center;
        border-radius: 28px;
        background: var(--card);
        border: 1px solid var(--border);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 25px 60px -20px rgba(59, 130, 246, 0.25);
        animation: rise 0.7s ease-out both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: none; }
      }

      /* Big "404" with a light sweeping across the gradient (same effect as the name on the home page) */
      .code {
        font-size: clamp(84px, 20vw, 136px);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -4px;
        background-image:
          linear-gradient(110deg, transparent 35%, var(--shine) 50%, transparent 65%),
          linear-gradient(to right, #60a5fa, #a855f7, #ec4899);
        background-size: 250% 100%, 100% 100%;
        background-repeat: no-repeat;
        background-position: 150% 0, 0 0;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 4s ease-in-out infinite;
      }
      @keyframes shine {
        0% { background-position: 150% 0, 0 0; }
        60%, 100% { background-position: -50% 0, 0 0; }
      }

      h1 {
        margin-top: 12px;
        font-size: clamp(24px, 5vw, 32px);
        font-weight: 800;
      }

      p {
        margin: 12px auto 0;
        max-width: 380px;
        color: var(--muted);
        line-height: 1.6;
      }

      .actions {
        margin-top: 32px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      }
      .btn:hover { transform: translateY(-2px); }
      .btn:active { transform: scale(0.96); }
      .btn.primary {
        color: #fff;
        background: linear-gradient(to right, #2563eb, #9333ea);
        box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.6);
      }
      .btn.secondary {
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
      }
      .btn.secondary:hover { border-color: rgba(59, 130, 246, 0.5); }

      .contact {
        margin-top: 24px;
        font-size: 14px;
        color: var(--muted);
      }
      .contact a { color: #3b82f6; text-decoration: none; font-weight: 600; }
      .contact a:hover { text-decoration: underline; }

      /* ---------- Fake terminal: a little debugging session ---------- */
      .term {
        margin: 24px auto 0;
        text-align: left;
        border-radius: 16px;
        overflow: hidden;
        background: #0b1020; /* terminals are dark in both themes */
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.6);
      }
      .term-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .term-bar i { width: 10px; height: 10px; border-radius: 50%; display: block; }
      .term-bar i:nth-child(1) { background: #ef4444; }
      .term-bar i:nth-child(2) { background: #f59e0b; }
      .term-bar i:nth-child(3) { background: #22c55e; }
      .term-bar span {
        margin-left: 8px;
        font-size: 12px;
        color: #64748b;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
      }
      .term-body {
        padding: 14px 16px 16px;
        min-height: 168px; /* room for every line, so the card doesn't jump while typing */
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 13px;
        font-variant-ligatures: none; /* stop coding fonts turning "->" into arrows */
        line-height: 1.7;
        color: #cbd5e1;
      }
      @media (max-width: 480px) {
        .term-body { font-size: 12px; min-height: 0; }
      }
      .term-body div { white-space: pre-wrap; word-break: break-word; }
      .term-body .cmd::before { content: '$ '; color: #a78bfa; }
      .term-body .err { color: #f87171; }
      .term-body .ok { color: #34d399; }
      .term-body .dim { color: #94a3b8; }
      .caret {
        display: inline-block;
        width: 8px;
        height: 15px;
        margin-left: 2px;
        vertical-align: -2px;
        background: #a78bfa;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }

      /* ---------- Excuse generator ---------- */
      .excuse {
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 14px;
        color: var(--muted);
      }
      .excuse q {
        color: var(--text);
        font-weight: 600;
        font-style: italic;
      }
      .excuse button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        padding: 6px 12px;
        border-radius: 999px;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      .excuse button:hover { border-color: rgba(168, 85, 247, 0.6); transform: rotate(-3deg); }
      .excuse button:active { transform: scale(0.94); }

      @media (prefers-reduced-motion: reduce) {
        .glow, .card, .code, .caret { animation: none; }
        .code { background-position: -50% 0, 0 0; }
      }
    </style>
  </head>
  <body>
    <svg class="hex" aria-hidden="true">
      <defs>
        <pattern id="hex" width="60" height="103.92" patternUnits="userSpaceOnUse">
          <path d="M30 103.92L0 86.6V51.96L30 34.64L60 51.96V86.6Z M0 34.64L30 17.32L60 34.64" fill="none" stroke="currentColor" stroke-width="1" />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#hex)" />
    </svg>
    <div class="glow blue"></div>
    <div class="glow purple"></div>

    <main class="card">
      <div class="code">404</div>
      <h1>Well, this is awkward.</h1>
      <p>I built this whole portfolio and you still found the one page I didn't. Let's pretend this never happened.</p>

      <!-- Typed out by the script at the bottom -->
      <div class="term" role="img" aria-label="A joke terminal session: the page can't be found, git blame says it's my unfinished TODO, and even sudo can't find it.">
        <div class="term-bar" aria-hidden="true"><i></i><i></i><i></i><span>nadeem@portfolio: ~</span></div>
        <div class="term-body" id="term" aria-hidden="true"></div>
      </div>

      <div class="excuse">
        <span>Official excuse:</span>
        <q id="excuse">It works on my machine.</q>
        <button type="button" id="new-excuse">🎲 Another one</button>
      </div>

      <div class="actions">
        <a class="btn primary" href="/">
          <!-- house icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Back to Home
        </a>
        <a class="btn secondary" href="/#projects">
          <!-- code icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          View Projects
        </a>
      </div>

      <p class="contact">Found a real bug? <a href="/#contact">Report it</a> and I'll call it a feature.</p>
    </main>

    <script>
      // ---------- Fake terminal ----------
      // The address the visitor tried to open (shortened if it's very long).
      // Everything goes in with textContent, never as HTML, so a strange
      // address can't inject anything into the page.
      var path = window.location.pathname;
      try { path = decodeURIComponent(path); } catch (e) {} // keep it encoded if it's malformed
      if (path.length > 40) path = path.slice(0, 37) + '...';

      var lines = [
        { cls: 'cmd', text: 'cd ' + path },
        { cls: 'err', text: 'cd: no such file or directory: ' + path },
        { cls: 'cmd', text: 'git blame ' + path },
        { cls: 'dim', text: 'Sk Nadeem Ahammad · just now · "// TODO: build this page"' },
        { cls: 'cmd', text: 'sudo find ' + path },
        { cls: 'ok', text: "Nice try. Even sudo can't find it. Try the buttons below ↓" }
      ];

      var term = document.getElementById('term');
      var caret = document.createElement('span');
      caret.className = 'caret';

      function addLine(line) {
        var div = document.createElement('div');
        div.className = line.cls;
        term.appendChild(div);
        return div;
      }

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        // No typing animation: show the whole session at once
        lines.forEach(function (line) { addLine(line).textContent = line.text; });
      } else {
        var i = 0;
        (function next() {
          if (i >= lines.length) return;
          var line = lines[i++];
          var div = addLine(line);
          if (line.cls !== 'cmd') {
            // Output appears all at once, like a real terminal
            div.textContent = line.text;
            div.appendChild(caret);
            setTimeout(next, 450);
            return;
          }
          // Commands are "typed" one letter at a time
          var n = 0;
          (function type() {
            div.textContent = line.text.slice(0, ++n);
            div.appendChild(caret);
            if (n < line.text.length) setTimeout(type, 35 + Math.random() * 45);
            else setTimeout(next, 350);
          })();
        })();
      }

      // ---------- Excuse generator ----------
      var excuses = [
        'It works on my machine.',
        "That's not a bug, it's an undocumented feature.",
        'It must be a caching issue.',
        "I'll fix it in the next sprint.",
        'It was working five minutes ago.',
        'Have you tried clearing your cache?',
        'The intern deployed on a Friday.',
        'Mercury is in retrograde.',
        'It passed all the tests. (There were no tests.)',
        'This page is still in my backlog.',
        'The page is fine. The URL is wrong.',
        'AI wrote that link, not me.'
      ];
      var excuseEl = document.getElementById('excuse');
      var current = 0;
      document.getElementById('new-excuse').addEventListener('click', function () {
        var pick;
        do { pick = Math.floor(Math.random() * excuses.length); } while (pick === current);
        current = pick;
        excuseEl.textContent = excuses[pick];
      });

      // A little something for anyone who opens the developer tools here
      console.log(
        '%cLooking for bugs? You found one.%c\nThis page doesn\'t exist, but my portfolio does: ' + window.location.origin,
        'font-size:16px;font-weight:bold;color:#a855f7',
        'color:inherit'
      );
    </script>
  </body>
</html>
